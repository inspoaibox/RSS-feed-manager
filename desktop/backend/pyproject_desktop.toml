[project]
name = "rss-manager-desktop"
version = "1.0.0"
description = "RSS Manager Desktop - Windows Desktop Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "newspaper3k>=0.2.8",
    "openai>=1.10.0",
    "google-generativeai>=0.3.2",
    "playwright>=1.40.0",
    "cloakbrowser>=0.3.31",
    "python-dateutil>=2.8.2",
    "webdavclient3>=3.14.6",
    "apscheduler>=3.10.4",
    "pywebview>=4.4.1",
    "pyinstaller>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
