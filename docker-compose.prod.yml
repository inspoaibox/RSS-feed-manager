services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rss_manager_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rss_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rss_manager_prod_2024}
      POSTGRES_DB: ${POSTGRES_DB:-rss_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rss_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rss_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: rss_manager_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_prod_2024}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_prod_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rss_network

  # Backend API
  backend:
    image: ghcr.io/inspoaibox/rss-feed-manager-backend:${RSS_MANAGER_IMAGE_TAG:-latest}
    container_name: rss_manager_backend
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager_prod_2024}@postgres:5432/${POSTGRES_DB:-rss_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_prod_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-rss_manager_secret_key_2024_production}
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5666"]}
      - BASE_URL=${BASE_URL:-https://rss.8y.cx}
      - XDG_DATA_HOME=/data
      - ARGOS_PACKAGES_DIR=/data/argos-translate/packages
    volumes:
      - argos_data:/data/argos-translate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rss_network

  # Celery Worker
  celery_worker:
    image: ghcr.io/inspoaibox/rss-feed-manager-backend:${RSS_MANAGER_IMAGE_TAG:-latest}
    container_name: rss_manager_celery_worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=5 -Q feed,translation,celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager_prod_2024}@postgres:5432/${POSTGRES_DB:-rss_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_prod_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-rss_manager_secret_key_2024_production}
      - XDG_DATA_HOME=/data
      - ARGOS_PACKAGES_DIR=/data/argos-translate/packages
      - FEED_REFRESH_DISPATCH_LIMIT=${FEED_REFRESH_DISPATCH_LIMIT:-100}
      - FEED_BROWSER_REFRESH_DISPATCH_LIMIT=${FEED_BROWSER_REFRESH_DISPATCH_LIMIT:-50}
      - CUSTOM_RULE_DISPATCH_LIMIT=${CUSTOM_RULE_DISPATCH_LIMIT:-10}
      - CUSTOM_RULE_BROWSER_DISPATCH_LIMIT=${CUSTOM_RULE_BROWSER_DISPATCH_LIMIT:-1}
    volumes:
      - argos_data:/data/argos-translate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rss_network

  # Celery Worker for browser-backed fetching (Playwright/CloakBrowser)
  celery_browser_worker:
    image: ghcr.io/inspoaibox/rss-feed-manager-browser:${RSS_MANAGER_IMAGE_TAG:-latest}
    container_name: rss_manager_celery_browser_worker
    restart: always
    profiles:
      - browser
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=${BROWSER_WORKER_CONCURRENCY:-3} --max-tasks-per-child=${BROWSER_WORKER_MAX_TASKS_PER_CHILD:-20} -Q browser
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager_prod_2024}@postgres:5432/${POSTGRES_DB:-rss_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_prod_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-rss_manager_secret_key_2024_production}
      - XDG_DATA_HOME=/data
      - ARGOS_PACKAGES_DIR=/data/argos-translate/packages
      - FEED_REFRESH_DISPATCH_LIMIT=${FEED_REFRESH_DISPATCH_LIMIT:-100}
      - FEED_BROWSER_REFRESH_DISPATCH_LIMIT=${FEED_BROWSER_REFRESH_DISPATCH_LIMIT:-50}
      - CUSTOM_RULE_DISPATCH_LIMIT=${CUSTOM_RULE_DISPATCH_LIMIT:-10}
      - CUSTOM_RULE_BROWSER_DISPATCH_LIMIT=${CUSTOM_RULE_BROWSER_DISPATCH_LIMIT:-1}
    volumes:
      - argos_data:/data/argos-translate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rss_network

  # Celery Beat (Scheduler)
  celery_beat:
    image: ghcr.io/inspoaibox/rss-feed-manager-backend:${RSS_MANAGER_IMAGE_TAG:-latest}
    container_name: rss_manager_celery_beat
    restart: always
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rss_manager}:${POSTGRES_PASSWORD:-rss_manager_prod_2024}@postgres:5432/${POSTGRES_DB:-rss_manager}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_prod_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-rss_manager_secret_key_2024_production}
      - FEED_REFRESH_DISPATCH_LIMIT=${FEED_REFRESH_DISPATCH_LIMIT:-100}
      - FEED_BROWSER_REFRESH_DISPATCH_LIMIT=${FEED_BROWSER_REFRESH_DISPATCH_LIMIT:-50}
      - CUSTOM_RULE_DISPATCH_LIMIT=${CUSTOM_RULE_DISPATCH_LIMIT:-10}
      - CUSTOM_RULE_BROWSER_DISPATCH_LIMIT=${CUSTOM_RULE_BROWSER_DISPATCH_LIMIT:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rss_network

  # Frontend
  frontend:
    image: ghcr.io/inspoaibox/rss-feed-manager-frontend:${RSS_MANAGER_IMAGE_TAG:-latest}
    container_name: rss_manager_frontend
    restart: always
    ports:
      - "5666:80"
    depends_on:
      - backend
    networks:
      - rss_network

volumes:
  postgres_data:
  redis_data:
  argos_data:

networks:
  rss_network:
    driver: bridge
