name: Build and Publish Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rss_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rss_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.11
      - run: uv run --frozen ruff check app
      - run: uv run --frozen ruff format --check app
      - run: uv run --frozen pytest -q
      - name: Validate legacy PostgreSQL upgrades before publishing
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://rss_test:ci_test_password@localhost:5432/rss_test
          MIGRATION_TEST_FULL_CHAIN: '1'
        run: >-
          uv run --frozen pytest -q tests/test_push_ownership_migration.py
          tests/test_push_migration_upgrade_path.py tests/test_postgresql_migration_chain.py
          tests/test_retire_mc_translation.py
          tests/test_translation_cost_migration.py
      - name: Validate database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://rss_test:ci_test_password@localhost:5432/rss_test
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic current --check-heads

  docker:
    needs: [frontend-checks, backend-checks]
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/inspoaibox/rss-feed-manager-backend
          - name: browser
            context: ./backend
            file: ./backend/Dockerfile.browser
            image: ghcr.io/inspoaibox/rss-feed-manager-browser
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/inspoaibox/rss-feed-manager-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/inspoaibox/RSS-feed-manager
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
