[project]
name = "rss-manager"
version = "0.1.0"
description = "RSS Subscription Manager - A feature-rich RSS/Atom feed aggregator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.19.0",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "socksio>=1.0.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "lxml_html_clean>=0.4.0",
    "newspaper3k>=0.2.8",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "openai>=1.10.0",
    "google-generativeai>=0.3.2",
    "argostranslate>=1.9.6",
    "python-dateutil>=2.8.2",
    "webdavclient3>=3.14.6",
    "pgvector>=0.2.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "cloakbrowser>=0.3.31",
]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.2",
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
